<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Document</title>
</head>

<body class="bg-[url(./assets/image.png)] bg-cover bg-center text-white min-h-screen flex items-center justify-center p-6">    


   <div class="w-full max-w-2xl">
	<div class="w-full bg-white rounded-lg p-10 sm:p-14 shadow-[0_0_30px_rgba(255,255,255,0.7)] dark:bg-transparent">
		<form class="space-y-6" action="#">
			<h3 class="text-3xl font-medium text-gray-900 dark:text-white">Login to our platform</h3>
			<div>
				<label for="email" class="text-lg font-medium text-gray-900 block mb-2 dark:text-white">Your email</label>
				<input type="email" name="email" id="email" class="bg-[#0d0d0d]border border-gray-300 text-gray-900 sm:text-lg rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-[#0d0d0d] dark:border-gray-500 dark:placeholder-gray-400 dark:text-white" placeholder="name@mail.com" required="">
            </div>
				<div>
					<label for="password" class="text-lg font-medium text-gray-900 block mb-2 dark:text-white">Your password</label>
					<input type="password" name="password" id="password" placeholder="••••••••" class="bg-[#0d0d0d]border border-gray-300 text-gray-900 sm:text-lg rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-[#0d0d0d] dark:border-gray-500 dark:placeholder-gray-400 dark:text-white" required="">
                </div>
					<div class="flex items-start">
						<div class="flex items-start">
							
							</div>
						</div>
						<button type="submit" class="w-full text-white bg-[#0d0d0d] hover:bg-[#0d0d0d] focus:ring-4 focus:ring-blue-300 font-medium rounded-lg text-lg px-5 py-2.5 text-center dark:bg-[#0d0d0d] dark:hover:bg-[#0d0d0d] dark:focus:ring-blue-800">Login</button>
		</form>
	</div>
</div>
</body>

</html>
