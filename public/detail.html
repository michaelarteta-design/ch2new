<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Document</title>
</head>

<body class="bg-[url(../assets/roberto-contreras-gpcJHKTPKx8-unsplash-copy.png)] text-white">
    <nav
        class="fixed top-0 left-0 w-full flex items-center text-sm justify-between p-8 fixed z-10 bg-linear-to-r from-black from-10% via-gray-300 via-30% to-black to-90%">
        <div>
            <a class="text-gray-400 text-3xl font-serif transition-colors">
                FiFlix
            </a>
            <a class="text-xl font-semibold px-6">
                <span>
                    Home
                </span>
            </a>

        </div>
        <div class="flex justify-around px-10">


            <form class="max-w-md mx-auto">
                <label for="search" class="block mb-2.5 text-sm font-semibold text-xl sr-only ">Search</label>
                <div class="relative">
                    <div class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none">
                        <svg class="w-4 h-4 text-body" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24"
                            height="24" fill="none" viewBox="0 0 24 24">
                            <path stroke="currentColor" stroke-linecap="round" stroke-width="2"
                                d="m21 21-3.5-3.5M17 10a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z" />
                        </svg>
                    </div>
                    <input type="search" id="search"
                        class="block w-full p-3 ps-9 bg-neutral-secondary-medium border-2 border-solid text-heading text-sm rounded-full focus:ring-brand focus:border-brand shadow-xs placeholder:text-body"
                        placeholder="search by title" />
                    <button type="button"
                        class="absolute end-1.5 bottom-1.5 text-white bg-brand hover:bg-brand-strong box-border border border-transparent focus:ring-2 focus:ring-brand-medium shadow-xs font-semibold leading-5 rounded text-l px-3 py-1.5 focus:outline-none">Search</button>
                </div>
            </form>

            <button
                class="flex items-center space-x-2 text-white hover:text-white bg-transparent hover:bg-gray-800 border border-transparent hover:border-gray-700 px-3 py-1.5 rounded-full text-xl font-semibold transition-all">
                <span>Account</span>
            </button>
        </div>

    </nav>



    <div class="relative flex flex-col md:flex-row w-500 my-6 bg-transparent shadow-sm rounded-lg pt-65">
        <div class="relative p-2.5 md:w-2/5 shrink-0 overflow-hidden">
            <img src="https://images.unsplash.com/photo-1522202176988-66273c2fd55f?ixlib=rb-4.0.3&amp;ixid=MnwxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8&amp;auto=format&amp;fit=crop&amp;w=1471&amp;q=80"
                alt="card-image" class="h-full w-full rounded-md md:rounded-lg object-cover" />
        </div>
        <div class="p-6">
            <div
                class="mb-4 rounded-full bg-teal-600 py-0.5 px-2.5 border border-transparent text-xs text-white transition-all shadow-sm w-20 text-center">
                STARTUP</div>
            <h4 class="mb-2 text-white text-xl font-semibold">
                Lyft launching cross-platform service this week
            </h4>
            <p class="mb-8 text-white leading-normal font-light max-w-sm">
                Like so many organizations these days, Autodesk is a company in
                transition. It was until recently a traditional boxed software company
                selling licenses. Yet its own business model disruption is only part
                of the story
            </p>
            <div>
                <a href="#" class="text-white font-semibold text-sm hover:underline flex items-center">
                    Learn More
                    <svg xmlns="http://www.w3.org/2000/svg" class="ml-2 h-4 w-4" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M14 5l7 7m0 0l-7 7m7-7H3" />
                    </svg>
                </a>
            </div>
        </div>
    </div>


</body>

</html>
